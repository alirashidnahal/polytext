name: Composer Audit

on:
  workflow_dispatch:
  schedule:
    # Monday 09:30 Asia/Tehran (06:00 UTC)
    - cron: '0 6 * * 1'
  push:
    branches:
      - master
      - develop
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/composer-audit.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/composer-audit.yml'

concurrency:
  group: composer-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-lock:
    name: Audit locked dependencies (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, json, libxml, mbstring, zip
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit composer.lock
        run: composer audit --locked --format=plain

  resolve-fresh:
    name: Fresh resolution (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, json, libxml, mbstring, zip
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Resolve from Packagist without the committed lock
        run: |
          rm -f composer.lock
          composer config --unset platform.php
          composer update --prefer-dist --no-progress --with-all-dependencies

      - name: Audit freshly resolved tree
        run: composer audit --format=plain
