version: 2

updates:
  # Composer / PHP dependencies
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tehran
      day: monday
    open-pull-requests-limit: 8
    assignees:
      - alirashidnahal
    commit-message:
      prefix: composer
      include: scope
    labels:
      - dependencies
      - php
      - composer
    groups:
      phpoffice:
        patterns:
          - "phpoffice/*"
      dev-tools:
        patterns:
          - "phpstan/*"
          - "phpunit/*"
          - "laravel/pint"
    versioning-strategy: increase

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tehran
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - alirashidnahal
    commit-message:
      prefix: github-actions
      include: scope
    labels:
      - dependencies
      - github-actions
      - ci-cd
